spring.application.name=Kunal
# -----------------------------
# SERVER CONFIG
# -----------------------------
server.port=${PORT:9090}
server.forward-headers-strategy=framework

# -----------------------------
# DATABASE CONFIGURATION
# -----------------------------
# Using PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/realestate}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Darshan@5148}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# -----------------------------
# JPA / HIBERNATE CONFIG
# -----------------------------
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true


# -----------------------------
# CONNECTION POOL (HikariCP)
# -----------------------------
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000

# -----------------------------
# FILE UPLOAD (PROJECT DOCUMENTS)
# -----------------------------
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# -----------------------------
# STORAGE CONFIG
# -----------------------------
app.storage.type=${APP_STORAGE_TYPE:local}
app.storage.local-root=${APP_STORAGE_LOCAL_ROOT:uploads}
aws.region=${AWS_REGION:ap-south-1}
aws.s3.project-docs-bucket=${AWS_S3_PROJECT_DOCS_BUCKET:}
aws.s3.chat-docs-bucket=${AWS_S3_CHAT_DOCS_BUCKET:}
aws.s3.kyc-docs-bucket=${AWS_S3_KYC_DOCS_BUCKET:${AWS_S3_PROJECT_DOCS_BUCKET:}}
aws.s3.kyc-kms-key-id=${AWS_S3_KYC_KMS_KEY_ID:}
app.security.allowed-origins=${APP_SECURITY_ALLOWED_ORIGINS:https://realestate-guide.in,https://www.realestate-guide.in}
app.security.login-rate-limit.enabled=${LOGIN_RATE_LIMIT_ENABLED:true}
app.security.login-rate-limit.max-requests=${LOGIN_RATE_LIMIT_MAX_REQUESTS:5}
app.security.login-rate-limit.window=${LOGIN_RATE_LIMIT_WINDOW:1m}

# -----------------------------
# ACTUATOR / HEALTH
# -----------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# -----------------------------
# JWT CONFIG (For Authentication Later)
# -----------------------------
jwt.secret=${JWT_SECRET:dev-secret-key-must-be-at-least-32-chars-long-1234567890}
jwt.expiration=${JWT_EXPIRATION_MS:1800000}
jwt.issuer=${JWT_ISSUER:realestate-guide}
jwt.audience=${JWT_AUDIENCE:realestate-clients}


# Razorpay
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}

# -----------------------------
# Forgot password / OTP mail settings (Brevo SMTP)
# -----------------------------
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${MAIL_FROM:noreply@realestate-guide.in}
app.otp.expiry-minutes=${OTP_EXPIRY_MINUTES:10}
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:}
firebase.project-id=${FIREBASE_PROJECT_ID:}

server.error.include-message=never
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.socket=INFO
