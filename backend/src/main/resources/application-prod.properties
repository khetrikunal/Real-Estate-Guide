server.port=9090
server.forward-headers-strategy=framework

# PostgreSQL
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/realestate
spring.datasource.username=${DB_USERNAME:realestate_user}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000

spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

app.storage.type=s3
app.storage.local-root=/home/ec2-user/uploads

aws.region=${AWS_REGION:ap-south-1}
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}

aws.s3.project-docs-bucket=${AWS_S3_PROJECT_DOCS_BUCKET:estate1-prod-project-docs-6da540}
aws.s3.chat-docs-bucket=${AWS_S3_CHAT_DOCS_BUCKET:estate1-prod-chat-docs-6da540}
aws.s3.kyc-docs-bucket=${AWS_S3_KYC_DOCS_BUCKET:${AWS_S3_PROJECT_DOCS_BUCKET:estate1-prod-project-docs-6da540}}
aws.s3.kyc-kms-key-id=${AWS_S3_KYC_KMS_KEY_ID:}

app.security.allowed-origins=${APP_SECURITY_ALLOWED_ORIGINS:http://43.205.232.94,http://43.205.232.94:9090,https://realestate-guide.in,https://www.realestate-guide.in}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.health.mail.enabled=false

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.issuer=${JWT_ISSUER:realestate-guide}
jwt.audience=${JWT_AUDIENCE:realestate-clients}

razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}

spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=noreply@realestate-guide.in
app.otp.expiry-minutes=10

firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:}
firebase.project-id=${FIREBASE_PROJECT_ID:}

server.error.include-message=never
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.socket=INFO
